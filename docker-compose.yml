services:
  stripe:
    image: stripe/stripe-cli:latest
    container_name: agrosys-stripe-cli
    command: >
      listen
      --api-key ${STRIPE_SECRET}
      --forward-to ${STRIPE_FORWARD_TO:-http://host.docker.internal:8000/stripe/webhook}
      --events checkout.session.completed,customer.subscription.created,customer.subscription.updated,customer.subscription.deleted,invoice.payment_succeeded,invoice.payment_failed
    environment:
      STRIPE_SECRET: ${STRIPE_SECRET}
      STRIPE_FORWARD_TO: ${STRIPE_FORWARD_TO:-http://host.docker.internal:8000/stripe/webhook}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
