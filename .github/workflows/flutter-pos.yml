name: Flutter POS
on:
  workflow_dispatch:
    inputs:
      publish_store:
        description: 'Enviar el MSIX como actualización a Microsoft Store (la app ya debe estar publicada)'
        type: boolean
        default: false
  push:
    paths: ['clients/agrosys_pos/**', '.github/workflows/flutter-pos.yml']
  pull_request:
    paths: ['clients/agrosys_pos/**', '.github/workflows/flutter-pos.yml']
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/agrosys_pos
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - run: git diff --exit-code -- lib/data/database.g.dart
      - run: flutter analyze
      - run: flutter test
  native-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            device: macos
          - os: windows-latest
            device: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: clients/agrosys_pos
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test integration_test/offline_reopen_test.dart -d ${{ matrix.device }}
      - run: flutter test integration_test/sync_recovery_test.dart -d ${{ matrix.device }}
      - run: flutter build ${{ matrix.device }} --release --dart-define-from-file=config/production.json
      - name: Package Windows release
        if: matrix.device == 'windows'
        id: windows-package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionLine = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:\s*(\S+)\s*$' }
          if (-not $versionLine) { throw 'Missing version in pubspec.yaml' }
          $version = ($versionLine -replace '^version:\s*', '').Trim()
          $bundle = 'build/windows/x64/runner/Release'
          foreach ($required in @('agrosys_pos.exe', 'flutter_windows.dll', 'data')) {
            if (-not (Test-Path "$bundle/$required")) { throw "Missing Windows bundle file: $required" }
          }
          # Ship the redistributable CRT beside the executable for per-user installs.
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Visual Studio C++ installation not found' }
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory |
            Sort-Object { [version]$_.Parent.Parent.Name } -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Redistributable x64 CRT not found' }
          Copy-Item "$($crt.FullName)/*.dll" $bundle -Force
          foreach ($required in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (-not (Test-Path "$bundle/$required")) { throw "Missing CRT: $required" }
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $name = "AgroSys-POS-$version-Windows-x64"
          $archive = "dist/$name.zip"
          Compress-Archive -Path "$bundle/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content "dist/$name.zip.sha256" -Encoding ascii
          "name=$name" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build Windows installer
        if: matrix.device == 'windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.windows-package.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version=6.5.4 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found' }
          & $iscc "/DAppVersion=$env:APP_VERSION" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $installer = 'dist/AgroSys-POS-Setup.exe'
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AgroSys-POS-Setup.exe" | Set-Content "$installer.sha256" -Encoding ascii
      - name: Verify Windows installer
        if: matrix.device == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'AgroSys-POS-install-check'
          $setup = Start-Process -FilePath (Resolve-Path 'dist/AgroSys-POS-Setup.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$target`"") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Install failed: $($setup.ExitCode)" }
          foreach ($required in @('agrosys_pos.exe', 'flutter_windows.dll', 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'data/flutter_assets', 'unins000.exe')) {
            if (-not (Test-Path "$target/$required")) { throw "Installed file missing: $required" }
          }
          $uninstall = Start-Process -FilePath "$target/unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed: $($uninstall.ExitCode)" }
          if (Test-Path "$target/agrosys_pos.exe") { throw 'Uninstall did not remove executable' }
      - name: Upload Windows release
        if: matrix.device == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.windows-package.outputs.name }}
          path: |
            clients/agrosys_pos/dist/*-Windows-x64.zip
            clients/agrosys_pos/dist/*-Windows-x64.zip.sha256
            clients/agrosys_pos/dist/AgroSys-POS-Setup.exe
            clients/agrosys_pos/dist/AgroSys-POS-Setup.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
  publish-windows-download:
    needs: [quality, native-desktop]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: windows-download-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Download verified Windows package
        uses: actions/download-artifact@v4
        with:
          pattern: AgroSys-POS-*-Windows-x64
          path: windows-package
          merge-multiple: true
      - name: Save installer in public downloads
        env:
          BUILD_COMMIT: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Never publish a binary built from an older branch revision.
          if [ "$(git rev-parse HEAD)" != "$BUILD_COMMIT" ]; then
            echo "Branch advanced since this build; skipping stale installer."
            exit 0
          fi
          cd windows-package
          sha256sum --check AgroSys-POS-Setup.exe.sha256
          cd ..
          # GitHub rejects individual Git files above 100 MiB.
          if [ "$(stat -c %s windows-package/AgroSys-POS-Setup.exe)" -ge 104857600 ]; then
            echo "Installer exceeds GitHub's Git file size limit."
            exit 1
          fi
          mkdir -p public/downloads
          cp windows-package/AgroSys-POS-Setup.exe public/downloads/
          cp windows-package/AgroSys-POS-Setup.exe.sha256 public/downloads/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/downloads/AgroSys-POS-Setup.exe public/downloads/AgroSys-POS-Setup.exe.sha256
          if git diff --cached --quiet; then
            echo "Installer already up to date."
            exit 0
          fi
          git commit -m 'build: update Windows POS installer'
          git push origin "HEAD:$TARGET_BRANCH"
  # Paquete MSIX para Microsoft Store: la Store lo firma, no requiere certificado propio.
  # Requiere las variables de repositorio MSSTORE_IDENTITY_NAME, MSSTORE_PUBLISHER y
  # MSSTORE_PUBLISHER_DISPLAY_NAME (Partner Center > Product identity).
  windows-store-package:
    needs: quality
    if: github.event_name != 'pull_request' && vars.MSSTORE_IDENTITY_NAME != ''
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clients/agrosys_pos
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build Microsoft Store MSIX
        id: msix
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = [ordered]@{
            identity_name = $env:IDENTITY_NAME
            publisher = $env:PUBLISHER
            publisher_display_name = $env:PUBLISHER_DISPLAY_NAME
          }
          foreach ($key in $identity.Keys) {
            if (-not $identity[$key]) { throw "Falta la variable de repositorio para $key (Partner Center > Product identity)." }
          }
          # La identidad va en msix_config (último bloque del pubspec) para no depender del quoting de la línea de comandos.
          $lines = foreach ($key in $identity.Keys) { "  ${key}: '$($identity[$key] -replace "'", "''")'" }
          Add-Content pubspec.yaml ($lines -join "`n")
          $versionLine = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:\s*(\S+)\s*$' }
          if (-not $versionLine) { throw 'Missing version in pubspec.yaml' }
          $version = (($versionLine -replace '^version:\s*', '').Trim() -replace '\+.*$', '')
          $name = "AgroSys-POS-$version-Store"
          dart run msix:create --store --output-path dist --output-name $name
          if ($LASTEXITCODE -ne 0) { throw 'msix:create failed' }
          $msix = "dist/$name.msix"
          if (-not (Test-Path $msix)) { throw "MSIX not generated: $msix" }
          # Verifica identidad, versión con revisión 0, runtime de Visual C++ y bundle de Flutter.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $msix))
          try {
            $entries = $zip.Entries | ForEach-Object { $_.FullName }
            foreach ($required in @('AppxManifest.xml', 'agrosys_pos.exe', 'flutter_windows.dll', 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
              if ($entries -notcontains $required) { throw "MSIX missing: $required" }
            }
            if (-not ($entries | Where-Object { $_ -like 'data/flutter_assets/*' })) { throw 'MSIX missing data/flutter_assets' }
            $reader = New-Object System.IO.StreamReader(($zip.Entries | Where-Object { $_.FullName -eq 'AppxManifest.xml' }).Open())
            [xml]$manifest = $reader.ReadToEnd()
            $reader.Close()
          } finally { $zip.Dispose() }
          $id = $manifest.Package.Identity
          if ($id.Name -ne $env:IDENTITY_NAME -or $id.Publisher -ne $env:PUBLISHER) { throw "Unexpected identity: $($id.Name) / $($id.Publisher)" }
          if ($id.Version -ne "$version.0") { throw "Unexpected MSIX version: $($id.Version)" }
          $hash = (Get-FileHash $msix -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.msix" | Set-Content "$msix.sha256" -Encoding ascii
          "name=$name" >> $env:GITHUB_OUTPUT
      - name: Upload Microsoft Store MSIX
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.msix.outputs.name }}
          path: |
            clients/agrosys_pos/dist/*-Store.msix
            clients/agrosys_pos/dist/*-Store.msix.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
  # Actualización automática en la Store: sólo ejecución manual con publish_store en la
  # rama predeterminada. La primera versión se sube a mano en Partner Center.
  publish-microsoft-store:
    needs: [native-desktop, windows-store-package]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish_store &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    concurrency:
      group: microsoft-store-publication
      cancel-in-progress: false
    steps:
      - name: Download verified MSIX
        uses: actions/download-artifact@v4
        with:
          pattern: AgroSys-POS-*-Store
          path: store-package
          merge-multiple: true
      - uses: microsoft/microsoft-store-apppublisher@v1.1
      - name: Publish package update
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('TENANT_ID', 'SELLER_ID', 'CLIENT_ID', 'CLIENT_SECRET', 'PRODUCT_ID')) {
            if (-not (Get-Item "env:$name" -ErrorAction SilentlyContinue).Value) { throw "Falta el secreto o variable para $name." }
          }
          $msix = @(Get-ChildItem store-package -Filter *.msix)
          if ($msix.Count -ne 1) { throw "Expected one MSIX, found $($msix.Count)" }
          Push-Location store-package
          try {
            $check = (Get-Content "$($msix[0].Name).sha256").Split(' ')[0]
            if ((Get-FileHash $msix[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $check) { throw 'MSIX checksum mismatch' }
          } finally { Pop-Location }
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'msstore reconfigure failed' }
          msstore publish $msix[0].FullName -id $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw 'msstore publish failed' }
  android:
    runs-on: ${{ vars.ANDROID_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clients/agrosys_pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
      - name: Enable emulator hardware acceleration
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            sudo modprobe kvm
            if lscpu | grep -q GenuineIntel; then
              sudo modprobe kvm_intel || true
            elif lscpu | grep -q AuthenticAMD; then
              sudo modprobe kvm_amd || true
            fi
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if [ ! -c /dev/kvm ]; then
            lscpu
            echo '::error::This runner does not expose /dev/kvm. Set the repository variable ANDROID_CI_RUNNER to a Linux runner with KVM support.'
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo '::error::The runner user cannot read/write /dev/kvm after configuring permissions.'
            exit 1
          fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          disable-linux-hw-accel: false
          disable-animations: true
          working-directory: clients/agrosys_pos
          script: bash tool/ci_android_integration.sh
      - name: Upload Android integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-integration-logs
          path: clients/agrosys_pos/build/ci-logs/
          if-no-files-found: ignore
          retention-days: 14
  ios-simulator:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: clients/agrosys_pos
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --simulator --debug --no-codesign
